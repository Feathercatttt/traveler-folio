name: Publish Owlbear extension
on:
  push:
    branches: [main]
    paths:
      - outputs/owlbear/**
      - work/build-pages21.py
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: outputs/owlbear/src/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: outputs/owlbear/src
      - run: npm run build
        working-directory: outputs/owlbear/src
      - run: python work/build-pages21.py --dest _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
