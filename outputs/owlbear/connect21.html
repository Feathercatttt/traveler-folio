<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>旅人手札 · 本机连接</title><style>body{background:#f4ead5;color:#493725;font:16px/1.7 system-ui;margin:24px}h1{font-size:22px}button{padding:9px 18px;background:#805d31;color:#fff;border:0;border-radius:8px}small{color:#6b5943}</style><h1>旅人手札 · 本机连接</h1><p id="state">正在等待枭熊插件连接…</p><small>连接后可最小化此窗口。关闭会断开本机角色卡连接，房间工具仍可使用。</small><p><button onclick="window.close()">断开并关闭</button></p><script>
const q=new URLSearchParams(location.hash.slice(1)),origin=q.get('origin'),nonce=q.get('nonce');let owner=null,token='';
const allowed=new Set(['https://feathercatttt.github.io','http://localhost:17632','http://127.0.0.1:17632']);
window.addEventListener('message',async e=>{const x=e.data;if(!allowed.has(origin)||e.origin!==origin||x?.nonce!==nonce)return;if(x.folio21==='hello'){owner=e.source;owner.postMessage({folio21:'ready',nonce},origin);document.getElementById('state').textContent='已连接枭熊插件。角色数据仍保存在本机。';return;}if(e.source!==owner||x.folio21!=='request'||!/^\/api\/[a-z0-9-]+(?:\?|$)/.test(x.path||''))return;try{if(!token){const r=await fetch('/api/session');token=(await r.json()).token;}const r=await fetch(x.path,{method:x.body?'POST':'GET',headers:{'X-Folio-Token':token,...(x.body?{'Content-Type':'application/json'}:{})},...(x.body?{body:JSON.stringify(x.body)}:{})}),result=await r.json();if(!r.ok)throw Error(result.error||'本机连接失败');owner.postMessage({folio21:'reply',nonce,id:x.id,result},origin);}catch(err){owner.postMessage({folio21:'reply',nonce,id:x.id,error:err.message},origin);}});
</script></html>
