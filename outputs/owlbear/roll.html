<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>确认掷骰 · 旅人手札</title><link rel="stylesheet" href="style.css"><style>body{height:auto;min-height:100vh}form{padding:14px}form>.muted{margin:0 0 12px}form .selectors{padding:6px 0}header{padding:12px}form label{display:block;margin:8px 0 4px;font-weight:600}form input[type=text]{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;font:600 15px "Microsoft YaHei",sans-serif;background:var(--light);color:var(--ink)}#preview{display:block;padding:12px;border:1px dashed var(--gold);border-radius:6px;overflow-wrap:anywhere;font-size:16px;font-weight:700}.buttons{display:flex;gap:10px;margin-top:12px}.buttons button{flex:1;padding:12px}.confirm{background:var(--primary);color:var(--onPrimary)}#message{font-size:12px;color:var(--red)}.inline{display:flex;gap:8px;align-items:center}</style></head><body><header><img src="icon.svg" alt=""><div><h1>确认本次公式</h1><small id="title"></small></div></header><form id="form"><p class="muted">先修改骰子和加值，最后点击确认。此窗口打开时尚未掷骰。</p><label for="notation">骰子 / 基础公式</label><input id="notation" type="text" required maxlength="1000" placeholder="1d20+5"><div id="once18"></div><section id="targets19" hidden style="padding:10px;margin-top:10px;border:1px solid var(--line);border-radius:8px"><b>确认伤害目标</b><div id="targetRows19"></div><label>多目标掷骰方式<select id="targetMode19"><option value="shared">一起骰 · 所有目标共用一次结果</option><option value="separate">分别骰 · 每个目标独立结果</option></select></label><small>只掷骰，不自动扣血。待用骰子仅用于本次的第一项检定。</small></section><label for="bonus">额外临时加值</label><input id="bonus" type="text" maxlength="200" placeholder="例如 2 或 -1，留空即可"><div class="selectors"><label>骰子引擎<select id="engine"><option value="auto">内置动画骰优先</option><option value="suite">内置动画骰</option><option value="dice-plus">Dice+ 3D</option><option value="text">文字骰</option></select></label><label>可见范围<select id="audience"><option value="self">自己</option><option value="everyone">所有人</option><option value="dm">自己与 GM</option><option value="gm_only">仅 GM</option></select></label></div><label class="inline"><input type="checkbox" id="report">只发送数值 / DC</label><label>最终发送内容</label><output id="preview"></output><div class="buttons"><button type="button" id="cancel">取消</button><button type="submit" id="submit" class="confirm">确认掷骰</button></div><p id="message" role="status"></p></form><script src="roll.js"></script></body></html>
