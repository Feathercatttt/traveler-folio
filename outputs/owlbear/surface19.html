<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旅人剧场</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:"Microsoft YaHei",sans-serif}body{pointer-events:none}.cinema:before,.cinema:after{content:'';position:fixed;left:0;right:0;height:8vh;background:#090807;z-index:5;pointer-events:none}.cinema:before{top:0}.cinema:after{bottom:0}#status{position:fixed;top:2vh;width:100%;text-align:center;color:#e7cda2;font-size:14px;font-weight:700;z-index:8}.stage{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;gap:2vw;padding:8vh 3vw 0;pointer-events:none}.standing{position:relative;height:75vh;flex:0 1 25vw;min-width:0;display:flex;align-items:flex-end;justify-content:center;animation:enter 220ms ease-out}.standing img{max-width:100%;width:auto;max-height:100%;object-fit:contain;filter:drop-shadow(0 8px 18px #000a);transition:opacity 150ms}.standing span{position:absolute;bottom:2vh;background:#201b18e8;color:#f2e6ce;border:1px solid #bf9d64;padding:5px 14px;font-size:14px;font-weight:700;border-radius:4px}.memory img{filter:sepia(.75) contrast(.95)}.noir img{filter:grayscale(1) contrast(1.2)}.ghost img{filter:grayscale(.6) hue-rotate(80deg) drop-shadow(0 0 15px #73cb9e);opacity:.8}.warm img{filter:sepia(.4) saturate(1.3)}.dream img{filter:drop-shadow(0 0 20px #af95d8) saturate(.7)}.silhouette img{filter:brightness(0)}.fire img{filter:drop-shadow(0 0 14px #e47735) sepia(.5)}.hologram img{filter:sepia(1) hue-rotate(130deg) saturate(1.7);opacity:.8}.ice img{filter:sepia(.8) hue-rotate(150deg) drop-shadow(0 0 12px #82d6ff)}.glitch img{animation:glitch 3s steps(1) infinite}.rain:after{content:'';position:fixed;inset:0;opacity:.3;background:repeating-linear-gradient(105deg,transparent 0 29px,#a5bec83d 30px,transparent 32px);animation:rain 900ms linear infinite;pointer-events:none}body.stop{pointer-events:auto;touch-action:none}body.stop #status{letter-spacing:3px}body.gm{pointer-events:none}@keyframes enter{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}@keyframes glitch{0%,93%,100%{transform:none}94%{transform:translateX(3px);filter:drop-shadow(-5px 0 #64c4c8)}96%{transform:translateX(-3px);filter:drop-shadow(5px 0 #b95b76)}}@keyframes rain{to{transform:translate(20px,45px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="status"></div><div id="stage" class="stage"></div><script src="surface19.js"></script></body></html>
