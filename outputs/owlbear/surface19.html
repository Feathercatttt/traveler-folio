<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旅人剧场</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:"Microsoft YaHei",sans-serif}body{pointer-events:none}
#status{display:none}.stage{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;gap:clamp(0px,1.4vw,24px);padding:0 3vw;pointer-events:none;isolation:isolate}
.standing{position:relative;height:min(82vh,100%);flex:0 1 calc(82vw / var(--cast-count,1));min-width:0;display:flex;align-items:flex-end;justify-content:center;animation:enter 360ms cubic-bezier(.18,.72,.2,1) both}
.standing img{display:block;max-width:min(100%,66vh);width:auto;height:100%;max-height:82vh;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 9px 22px #0009);transition:opacity 180ms,filter 180ms}
.standing span{position:absolute;left:50%;bottom:2.5vh;transform:translateX(-50%);max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:rgba(20,17,19,.66);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#f5ead8;border:1px solid rgba(255,255,255,.23);padding:5px 13px;font-size:14px;font-weight:650;border-radius:999px;box-shadow:0 4px 18px #0004}
.memory img{filter:sepia(.75) contrast(.95)}.noir img{filter:grayscale(1) contrast(1.2)}.ghost img{filter:grayscale(.6) hue-rotate(80deg) drop-shadow(0 0 15px #73cb9e);opacity:.8}.warm img{filter:sepia(.4) saturate(1.3)}.dream img{filter:drop-shadow(0 0 20px #af95d8) saturate(.7)}.silhouette img{filter:brightness(0)}.fire img{filter:drop-shadow(0 0 14px #e47735) sepia(.5)}.hologram img{filter:sepia(1) hue-rotate(130deg) saturate(1.7);opacity:.8}.ice img{filter:sepia(.8) hue-rotate(150deg) drop-shadow(0 0 12px #82d6ff)}.glitch img{animation:glitch 3s steps(1) infinite}
.rain:after{content:'';position:fixed;inset:0;opacity:.2;background:repeating-linear-gradient(105deg,transparent 0 29px,#a5bec83d 30px,transparent 32px);animation:rain 900ms linear infinite;pointer-events:none;z-index:-1}
@keyframes enter{from{transform:translateY(36px);opacity:0}to{transform:none;opacity:1}}@keyframes glitch{0%,93%,100%{transform:none}94%{transform:translateX(3px);filter:drop-shadow(-5px 0 #64c4c8)}96%{transform:translateX(-3px);filter:drop-shadow(5px 0 #b95b76)}}@keyframes rain{to{transform:translate(20px,45px)}}
@media(max-width:650px){.stage{padding:0 1vw;gap:0}.standing{height:74vh;flex-basis:calc(98vw / var(--cast-count,1))}.standing img{max-width:100%;max-height:74vh}.standing span{bottom:1vh;font-size:11px;padding:4px 10px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="status"></div><div id="stage" class="stage"></div><script src="surface19.js"></script></body></html>
