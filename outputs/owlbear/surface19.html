<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旅人剧场</title><link rel="stylesheet" href="theatre21.css?v=0.25.0"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:"Microsoft YaHei",sans-serif}body{pointer-events:none}
#status{display:none}.stage{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;gap:clamp(0px,1.4vw,24px);padding:0 3vw;pointer-events:none;isolation:isolate}
.standing{position:relative;height:min(82vh,100%);flex:0 1 calc(82vw / var(--cast-count,1));min-width:0;display:flex;align-items:flex-end;justify-content:center;animation:enter 360ms cubic-bezier(.18,.72,.2,1) both}
.standing img{display:block;max-width:min(100%,66vh);width:auto;height:100%;max-height:82vh;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 9px 22px #0009);transition:opacity 180ms,filter 180ms}
.standing span{position:absolute;left:50%;bottom:2.5vh;transform:translateX(-50%);max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:rgba(20,17,19,.66);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#f5ead8;border:1px solid rgba(255,255,255,.23);padding:5px 13px;font-size:14px;font-weight:650;border-radius:999px;box-shadow:0 4px 18px #0004}
.memory img{filter:sepia(.75) contrast(.95)}.noir img{filter:grayscale(1) contrast(1.2)}.ghost img{filter:grayscale(.6) hue-rotate(80deg) drop-shadow(0 0 15px #73cb9e);opacity:.8}.warm img{filter:sepia(.4) saturate(1.3)}.dream img{filter:drop-shadow(0 0 20px #af95d8) saturate(.7)}.silhouette img{filter:brightness(0)}.fire img{filter:drop-shadow(0 0 14px #e47735) sepia(.5)}.hologram img{filter:sepia(1) hue-rotate(130deg) saturate(1.7);opacity:.8}.ice img{filter:sepia(.8) hue-rotate(150deg) drop-shadow(0 0 12px #82d6ff)}.glitch img{animation:glitch 3s steps(1) infinite}
.rain:after{content:'';position:fixed;inset:0;opacity:.2;background:repeating-linear-gradient(105deg,transparent 0 29px,#a5bec83d 30px,transparent 32px);animation:rain 900ms linear infinite;pointer-events:none;z-index:-1}
@keyframes enter{from{transform:translateY(36px);opacity:0}to{transform:none;opacity:1}}@keyframes glitch{0%,93%,100%{transform:none}94%{transform:translateX(3px);filter:drop-shadow(-5px 0 #64c4c8)}96%{transform:translateX(-3px);filter:drop-shadow(5px 0 #b95b76)}}@keyframes rain{to{transform:translate(20px,45px)}}
@media(max-width:650px){.stage{padding:0 1vw;gap:0}.standing{height:74vh;flex-basis:calc(98vw / var(--cast-count,1))}.standing img{max-width:100%;max-height:74vh}.standing span{bottom:1vh;font-size:11px;padding:4px 10px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.standing{position:absolute;flex:none;bottom:0;left:50%;transform:translateX(-50%);animation:enter23 360ms cubic-bezier(.18,.72,.2,1) both;user-select:none;touch-action:none}
.standing img{max-width:100%;pointer-events:none}.standing span{pointer-events:none}
body.stage-moving23{pointer-events:auto}body.stage-moving23 .standing.can-move23{pointer-events:auto;cursor:grab}body.stage-moving23 .standing.dragging23{cursor:grabbing;animation:none;z-index:10}
@keyframes enter23{from{transform:translate(-50%,36px);opacity:0}to{transform:translateX(-50%);opacity:1}}
@media(max-width:650px){.standing{flex:none}}@media(prefers-reduced-motion:reduce){.standing{animation:none}}

.standing img{max-width:100%;max-height:100%;height:100%;width:auto}.standing-tools24{position:absolute;left:50%;bottom:calc(2.5vh + 38px);transform:translateX(-50%);display:flex;align-items:center;gap:5px;pointer-events:auto;background:#191b22bf;padding:3px 5px;border:1px solid #ffffff38;border-radius:8px;white-space:nowrap;z-index:12}.standing-tools24[hidden]{display:none}.standing-tools24 button{font:700 14px 'Microsoft YaHei',sans-serif;min-width:30px;min-height:30px;cursor:pointer;background:#3d3543;color:#fff1d5;border:1px solid #ffffff42;border-radius:5px}.standing-tools24 output{font-size:11px;color:#fff1d5;min-width:34px;text-align:center}
.surface-cue24{position:fixed;z-index:100;top:16px;left:16px;width:min(520px,calc(100vw - 32px));pointer-events:auto;font:600 12px 'Microsoft YaHei',sans-serif;color:#f4ead8}.surface-cue-handle24{display:flex;align-items:center;justify-content:space-between;background:#191b22a8;border:1px solid #ffffff29;border-bottom:0;border-radius:10px 10px 0 0;padding:5px 9px;cursor:grab;user-select:none;touch-action:none}.surface-cue-handle24 small{font-size:10px;opacity:.7}.surface-cue24 .stage-dock21{height:auto;min-height:78px;border-radius:0 0 10px 10px;background:#191b2299;box-shadow:none}.surface-cue24 button{font-family:inherit;cursor:pointer}.surface-cue24 #stageError24:empty{display:none}.surface-cue24 #stageError24{margin:4px 0;padding:6px;background:#3b1b24d9;color:#ffd1d1;border-radius:5px}.surface-cue24 select{cursor:pointer}.surface-cue24 :focus-visible{outline:2px solid #f0d1a0;outline-offset:2px}
@media(pointer:coarse){.standing-tools24 button{min-width:44px;min-height:44px}.surface-cue24 select{height:28px;min-height:28px}}
</style></head><body><div id="status"></div><div id="stage" class="stage"></div><script src="surface19.js?v=0.25.0"></script></body></html>
