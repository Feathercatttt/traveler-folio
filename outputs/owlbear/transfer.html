<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>旅人手札 · 手机互通</title><style>*{box-sizing:border-box}body{margin:0;background:#30241e;color:#35271e;font:16px/1.65 system-ui,sans-serif;padding:24px 16px}main{max-width:520px;margin:4vh auto;background:#f5e9d1;border:1px solid #c5a468;border-radius:18px;padding:26px}small{color:#715b3e}h1{margin:6px 0 12px}h2{font-size:18px;margin:0 0 8px}section{border-top:1px solid #cdbb97;padding-top:18px;margin-top:22px}button,a.btn{display:block;width:100%;padding:13px 16px;border:1px solid #936d3c;background:#79552e;color:#fff6e4;border-radius:9px;text-align:center;font:700 16px/1.4 system-ui;cursor:pointer;text-decoration:none;margin-top:12px}input{font-size:16px;max-width:100%;margin-top:12px}#message{min-height:28px;font-weight:650}p{margin:8px 0}</style><main><small>TRAVELER FOLIO · LOCAL HANDOFF</small><h1>手机 ↔ 电脑</h1><p>文件直接经过当前 Wi-Fi 传送。此链接有效 20 分钟，关闭电脑端互通后立即失效。</p><section><h2>把电脑数据带到手机</h2><p>① 下载互通文件。<br>② 返回手机版手札 → 互通 → 打开互通文件，预览并确认导入。</p><a class="btn" href="download" download="Traveler-Folio.folio">下载电脑的互通文件</a></section><section><h2>把手机数据传回电脑</h2><p>先在手机版手札 → 互通 → 保存互通文件，再在这里选择该文件。电脑会显示预览入口，由你确认导入。</p><label for="file">手机保存的 .folio / .txt 文件</label><input id="file" type="file" accept=".folio,.txt,text/plain,application/octet-stream"><button id="upload" type="button">发送到电脑</button></section><p id="message" role="status"></p><small>若无法打开此页，请确认手机与电脑在同一 Wi-Fi，并允许系统的本地网络访问。也可通过聊天软件、数据线或网盘传送互通文件。</small></main><script>document.getElementById('upload').onclick=async()=>{const b=document.getElementById('upload'),m=document.getElementById('message'),f=document.getElementById('file').files[0];if(!f){m.textContent='请先选择互通文件';return}if(f.size>34*1024*1024){m.textContent='文件过大';return}b.disabled=true;m.textContent='正在发送…';try{const r=await fetch('upload',{method:'POST',headers:{'Content-Type':'text/plain'},body:f});m.textContent=await r.text();if(!r.ok)b.disabled=false}catch{m.textContent='传送中断，请检查电脑互通是否仍开启';b.disabled=false}};</script></html>
